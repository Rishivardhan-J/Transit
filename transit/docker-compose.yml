version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transit_password}
      POSTGRES_DB: ${POSTGRES_DB:-transit_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    command: bash -c "uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app:z
    environment:
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: bash -c "PYTHONPATH=/app celery -A backend.jobs.celery_app worker --loglevel=info"
    volumes:
      - .:/app:z
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  beat:
    build: .
    command: bash -c "PYTHONPATH=/app celery -A backend.jobs.celery_app beat --loglevel=info"
    volumes:
      - .:/app:z
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
